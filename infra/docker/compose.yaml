# AI Coding
# compose.yaml — backing service cho MOI TRUONG DEV va CI.
#
# ⚠️ Day KHONG phai hinh trien khai production. ADR-002 CHOT #4 doi PostgreSQL
# la managed service co PITR va mot duong restore da dien tap, va muc
# `Alternatives` cua chinh ADR do da BAC phuong an "VPS + Docker Compose" cho
# production. File nay chi ton tai de may dev va CI co dung hai backing service
# ma kien truc can: mot PostgreSQL va mot object storage noi tap con S3.
#
# ⭐ Vi sao MinIO chu khong phai mot mock: no ep adapter chi dung dung tap con S3
# ma ADR-004 dieu 1 cho phep, va cho phep kiem chinh sach quyen "credential cua
# api va worker khong co DeleteObject tren prefix canonical" ngay tren may dev.

name: comic-studio

services:
  postgres:
    image: postgres:16.10-alpine
    container_name: comic-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comic_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comic_owner_dev}
      POSTGRES_DB: ${POSTGRES_DB:-comic_studio}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-comic_owner} -d ${POSTGRES_DB:-comic_studio}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: comic-studio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-comic_studio_dev}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-comic_studio_dev_secret}
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Chay mot lan de tao bucket va bat versioning. ADR-004 dieu 8 doi versioning:
  # mot loi lap trinh khong duoc phep xoa bang chung provenance.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: comic-studio-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-comic-studio}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-comic_studio_dev}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-comic_studio_dev_secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$STORAGE_ACCESS_KEY_ID $$STORAGE_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET &&
      mc version enable local/$$STORAGE_BUCKET &&
      mc anonymous set none local/$$STORAGE_BUCKET &&
      echo 'Bucket da san sang, versioning da bat, khong cho truy cap an danh'
      "

volumes:
  postgres-data:
    name: comic-studio-postgres-data
  minio-data:
    name: comic-studio-minio-data
