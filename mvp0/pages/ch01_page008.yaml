# AI Coding
# ch01_page008.yaml
# Chương 1 — trang 8/11. Ân nhân trở mặt thành kẻ giết người, rồi bị đâm từ sau lưng.
# panel_index 37–42 (tuần tự toàn chương).

page:
  page_id: "ch01_page008"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "The woman he just freed puts the blade to his throat and promises to kill
     the whole village — and is killed mid-sentence by a smiling old man with
     one leg."

  overall_mood:
    "vicious, fast, resolved by casual violence from an unexpected direction"

  layout:
    type: "multi_panel"
    panel_count: 6
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_38"
    rows:
      - { row: 1, y: 0.00, h: 0.18, panels: ["panel_37"] }
      - { row: 2, y: 0.18, h: 0.32, panels: ["panel_38"] }
      - { row: 3, y: 0.50, h: 0.22, panels: ["panel_39", "panel_40"] }
      - { row: 4, y: 0.72, h: 0.28, panels: ["panel_41", "panel_42"] }

  continuity:
    setting:
      "The same riverbank in broad daylight — a green grazing meadow along the water,
       blue-green mountains layered into the distance, clear sky with high white clouds."
    time_span:
      "Under a minute, continuous, standing on and around the discarded hide."
    spatial:
      "Qin Mu stays on the left / near side of the frame, the woman on the right /
       far side. Lame Grandpa arrives from behind her, deeper into the frame.
       This relationship is never reversed."
    environment:
      "Bright open daylight with short soft shadows on the grass. An empty cowhide
       lies flat on the grass between them, cut open and completely bloodless."
    wardrobe:
      "All characters keep identical hairstyle, outfit, and accessories in every panel."
    progression:
      - "panel_37: reaction. Standing over the hide, her face changes as eleven years catch up with her."
      - "panel_38: threat. She lays the sickle against his throat and tells him what she intends to do to the village."
      - "panel_39: reaction. Qin Mu understands none of it; the words go past him."
      - "panel_40: action. She lifts the sickle to bring it down."
      - "panel_41: climax. A saber blade comes out through her chest from behind."
      - "panel_42: reveal. Lame Grandpa is standing behind her, blade in hand, smiling and telling the boy to come home for his medicine."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


