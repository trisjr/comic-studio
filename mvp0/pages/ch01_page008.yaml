# ============================================================
# NEGATIVE CONSTRAINTS
# ============================================================

negative_constraints:
  - "Do not render any letters, words, speech bubbles, captions, or sound-effect lettering."
  - "Do not place faces or focal detail inside any text_safe_zone."
  - "Do not change character identity, hairstyle, outfit, or accessories between panels."
  - "Do not draw blood spray, arterial jets, pooled blood, viscera, or an exit wound — blood is limited to a thin edge line and a small stain on cloth."
  - "Do not draw the woman nude — the ragged damp silk inner robe is always present and covers her."
  - "Do not draw a living cow anywhere on this page; the hide is a flat empty object on the grass."
  - "Do not show Lame Grandpa's body, face, staff, or shadow before panel_42."
  - "Do not give Lame Grandpa an angry, grim, or shocked expression — his face never changes."
