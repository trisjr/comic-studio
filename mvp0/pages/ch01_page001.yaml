# ============================================================
# PANELS
# ============================================================

panels:

  # ---------------------------------------------------------- PANEL 01
  - id: "panel_01"
    panel_index: 1
    row: 1
    column: 1
    relative_width: 1.0
    relative_height: 0.22
    shape: "wide cinematic horizontal panel"
    beat_type: "establishing"
    emphasis: "medium"
    character_count: 1

    scene_delta:
      "Full village visible from a distance. A last orange sliver of sun behind
       the mountain ridge. The corner statues are still dark stone."

    characters:
      - character_id: "tu_ba_ba"
        position: "small figure, lower left third"
        pose: "standing hunched, one hand shading her eyes"
        action: "watching the sun drop behind the ridge"
        facial_expression: "not readable at this distance"
        gaze: "toward the mountain ridge"
        emotion: "impatience"

    camera:
      shot_type: "extreme wide establishing shot"
      camera_angle: "slightly high angle"
      camera_position: "on the slope above the village, looking down across the rooftops"
      perspective: "deep perspective, mountains layered behind the village"
      composition:
        "Village rooftops across the lower band, mountain ridge and dying sun
         across the upper band, Granny Si a small hunched shape at lower left."

    lighting:
      source: "last low orange sunlight from behind the mountain ridge"
      direction: "raking from the far left"
      intensity: "low and falling"
      shadow: "very long shadows stretching across the packed earth"

    effects:
      atmosphere: "cold blue shadow already filling the valley floor"

    text_safe_zone:
      - { x: 0.05, y: 0.05, w: 0.40, h: 0.28 }

    typeset:
      dialogue: []
      sfx: []

    panel_purpose:
      "Establish the village, its ring of statues, and the fact that the light
       is running out. The hunched silhouette must read even at this distance."


  # ---------------------------------------------------------- PANEL 02
  - id: "panel_02"
    panel_index: 2
    row: 2
    column: 1
    relative_width: 0.5
    relative_height: 0.24
    shape: "medium vertical panel"
    beat_type: "reaction"
    emphasis: "medium"
    character_count: 1

    scene_delta:
      "Simplified background: a mud wall and one crooked tree behind her."

    characters:
      - character_id: "tu_ba_ba"
        position: "center, slightly left"
        pose: "hunched forward, both hands gripping her apron"
        action: "staring at the last of the light"
        facial_expression: "tight-lipped, deep lines around the eyes"
        gaze: "toward the ridge, off-panel left"
        emotion: "anxious impatience"

    camera:
      shot_type: "medium close-up"
      camera_angle: "eye level"
      camera_position: "in front of Granny Si, slightly to her right"
      perspective: "shallow, background compressed"
      composition: "Her face fills the right two thirds; the wall is flat behind her."

    lighting:
      source: "the last orange sunlight, almost gone"
      direction: "hard from the left"
      intensity: "low"
      shadow: "half her face already in shadow"

    effects:
      atmosphere: "dust motes hanging dead still in the air"

    text_safe_zone:
      - { x: 0.05, y: 0.05, w: 0.35, h: 0.25 }

    typeset:
      dialogue: []
      sfx: []

    panel_purpose:
      "Put a face on the dread — the elder who knows exactly what nightfall means."


  # ---------------------------------------------------------- PANEL 03
  - id: "panel_03"
    panel_index: 3
    row: 2
    column: 2
    relative_width: 0.5
    relative_height: 0.24
    shape: "medium vertical panel"
    beat_type: "establishing"
    emphasis: "medium"
    character_count: 0

    scene_delta:
      "No characters. The wall of darkness rolls in from the west and swallows
       the mountains, the road and the trees, one after another."

    characters: []

    camera:
      shot_type: "wide landscape shot"
      camera_angle: "eye level"
      camera_position: "looking west along the empty road out of the village"
      perspective: "strong one-point perspective down the road"
      composition:
        "The road runs from the bottom edge into a mass of black that has already
         taken the upper two thirds of the frame."

    lighting:
      source: "the last dying daylight, losing to the advancing dark"
      direction: "from the vanishing point"
      intensity: "collapsing to nothing"
      shadow: "no separate shadows — everything is being absorbed"

    effects:
      atmosphere: "the darkness reads as a solid moving mass, not as absence of light"

    text_safe_zone:
      - { x: 0.10, y: 0.60, w: 0.80, h: 0.30 }

    typeset:
      dialogue: []
      sfx: []

    panel_purpose:
      "Make the darkness a physical thing that arrives, not a time of day."


  # ---------------------------------------------------------- PANEL 04
  - id: "panel_04"
    panel_index: 4
    row: 3
    column: 1
    relative_width: 1.0
    relative_height: 0.34
    shape: "large dominant wide panel"
    beat_type: "suspense"
    emphasis: "large"
    character_count: 2

    scene_delta:
      "Full night. All four corner statues glow faintly, turning the village into
