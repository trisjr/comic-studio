    lighting:
      source: "pale statue glow from behind and below"
      direction: "rim light along the jaw and ear"
      intensity: "low"
      shadow: "the front of her face mostly in shadow"

    effects:
      atmosphere: "a single thin line of tension in the composition, no visible sound effect"

    text_safe_zone:
      - { x: 0.03, y: 0.10, w: 0.40, h: 0.55 }

    typeset:
      dialogue: []
      sfx: []

    panel_purpose:
      "End the page on the hook — something is crying outside the safe ring."


