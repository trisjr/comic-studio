# AI Coding
# ch01_page001.yaml
# Chương 1 — trang 1/11. Mốc 11 năm trước, hoàng hôn tắt trên Tàn Lão thôn.
# panel_index 1–5 (tuần tự toàn chương).

page:
  page_id: "ch01_page001"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "Open the chapter on its single law — when night falls, do not go outside.
     The last light dies, the darkness swallows the village, and the four
     corner statues answer by lighting up."

  overall_mood:
    "hushed, ominous, folkloric dread held just under the surface"

  layout:
    type: "multi_panel"
    panel_count: 5
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_04"
    rows:
      - { row: 1, y: 0.00, h: 0.22, panels: ["panel_01"] }
      - { row: 2, y: 0.22, h: 0.24, panels: ["panel_02", "panel_03"] }
      - { row: 3, y: 0.46, h: 0.34, panels: ["panel_04"] }
      - { row: 4, y: 0.80, h: 0.20, panels: ["panel_05"] }

  continuity:
    setting:
      "A tiny remote mountain village of low mud-and-thatch houses, ringed by four
       ancient weathered stone statues standing one at each corner of the settlement.
       Bare packed-earth paths, a few crooked trees, mountains closing in on all sides."
    time_span:
      "The five panels cover the few minutes between the last sliver of sunset
       and full darkness."
    spatial:
      "Granny Si stays on the left / near side of the frame, Elder Ma on the
       right / far side. This relationship is never reversed."
    environment:
      "The scene runs from the last sliver of sunset behind the mountains into full
       darkness: as the final light dies the world falls completely silent and the four
       corner statues begin to give off a faint pale glow. Beyond the statues' reach the
       darkness is absolute and something moves inside it."
    wardrobe:
      "Both characters keep identical hairstyle, outfit, and accessories in every panel."
    progression:
      - "panel_01: establishing. Last orange sliver of sun behind the mountains, statues dark."
      - "panel_02: reaction. Granny Si watches the light die, impatient and uneasy."
      - "panel_03: establishing. The darkness rolls in from the west and swallows the valley."
      - "panel_04: suspense. Full night. All four corner statues glow faintly; the village is an island of pale light."
      - "panel_05: reaction. Granny Si's ear twitches — a sound from outside the statues' reach."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


