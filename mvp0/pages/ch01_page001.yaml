  line_art: "clean 2D anime lineart with controlled variable line weight"
  rendering: "flat cel shading with one or two shadow tones, no painterly blending"
  character_design: "stylized East Asian rural fantasy aesthetic, 2D anime proportions"
  background: "detailed vernacular mud-and-thatch architecture with cinematic atmospheric perspective"
