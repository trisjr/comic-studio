        pose: "standing square, single right arm hanging loose"
        action: "letting out a held breath"
        facial_expression: "grim, mouth slightly open"
        gaze: "out past the statue into the black"
        emotion: "wary relief"

    camera:
      shot_type: "wide shot"
      camera_angle: "slightly low angle"
      camera_position: "at ground level inside the village, near the corner statue"
      perspective: "the statue looms in the foreground, houses receding behind"
      composition:
        "The glowing statue anchors the left third, Granny Si beneath it,
         Elder Ma at right, and a hard black wall closing the frame behind them."
      focal_point: "the pale glow spreading out from the statue"

    lighting:
      source: "faint pale glow from the four corner stone statues"
      direction: "radiating outward and downward from each statue"
      intensity: "weak and short-reaching"
      shadow: "everything beyond the statues in flat black with no gradient"

    effects:
