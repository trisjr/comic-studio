      atmosphere: "absolute silence rendered as perfectly still air"

    text_safe_zone:
      - { x: 0.30, y: 0.04, w: 0.40, h: 0.22 }

    typeset:
      dialogue: []
      sfx: []

    panel_purpose:
      "Deliver the page's visual thesis: the statues are the only thing between
