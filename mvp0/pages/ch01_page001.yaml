    characters:
      - character_id: "tu_ba_ba"
        position: "right of center, head and shoulders only"
        pose: "head snapped toward the darkness, ear turned out"
        action: "catching a sound that should not exist"
        facial_expression: "eyes wide, mouth half open"
        gaze: "sharply off-panel right, toward the dark"
        emotion: "alarm"

    camera:
      shot_type: "close-up"
