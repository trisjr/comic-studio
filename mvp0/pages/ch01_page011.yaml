# AI Coding
# ch01_page011.yaml
# Chương 1 — trang 11/11. Đuôi con hổ bị bóng tối gặm trơ xương; đóng chương bằng câu hỏi mở.
# panel_index 52–56 (tuần tự toàn chương).

page:
  page_id: "ch01_page011"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "Lame Grandpa strolls back in a heartbeat ahead of the dark, carrying a live
     tiger. The darkness clips its tail on the way past and strips it to bare
     bone — and the chapter ends on the question nobody answers."

  overall_mood:
    "wry, then abruptly horrifying, closing on unresolved dread"

  layout:
    type: "multi_panel"
    panel_count: 5
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_55"
    rows:
      - { row: 1, y: 0.00, h: 0.20, panels: ["panel_52"] }
      - { row: 2, y: 0.20, h: 0.22, panels: ["panel_53", "panel_54"] }
      - { row: 3, y: 0.42, h: 0.36, panels: ["panel_55"] }
      - { row: 4, y: 0.78, h: 0.22, panels: ["panel_56"] }

  continuity:
    setting:
      "A tiny remote mountain village of low mud-and-thatch houses, ringed by four
       ancient weathered stone statues standing one at each corner of the settlement.
       Bare packed-earth paths, a few crooked trees, mountains closing in on all sides."
    time_span:
      "Under a minute at the village edge, in the last seconds before the dark
       reaches the statue line."
    spatial:
      "Granny Si and Qin Mu wait inside the village on the left / near side; Lame
       Grandpa comes in from the right / far side, out of the dark. This
       relationship is never reversed."
    environment:
      "Full night inside the ring, with the four corner statues glowing faintly and
       the darkness pressing right up against the edge of that glow. The dark moves
       like a tide rather than sitting still."
    wardrobe:
      "All characters keep identical hairstyle, outfit, and accessories in every panel."
    progression:
      - "panel_52: entrance. Lame Grandpa limps up the path out of the black with a live tiger across his back."
      - "panel_53: dialogue. Granny Si shouts at him to hurry; he does not."
      - "panel_54: action. He crosses the statue line exactly as the dark floods in behind him."
      - "panel_55: shock. The tiger screams — its tail has been stripped to bare white vertebrae."
      - "panel_56: closing. Qin Mu stares out into the black and finds nothing to look at."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


