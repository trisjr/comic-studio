# ============================================================
# NEGATIVE CONSTRAINTS
# ============================================================

negative_constraints:
  - "Do not render any letters, words, speech bubbles, captions, or sound-effect lettering."
  - "Do not place faces or focal detail inside any text_safe_zone."
  - "Do not change character identity, hairstyle, outfit, or accessories between panels."
  - "Do not swap the silhouette cues: only Elder Ma has the knotted empty sleeve, only Lame Grandpa has the staff and tied trouser leg, only Granny Si has the hunched back."
  - "Do not give Elder Ma a left arm, or Lame Grandpa a right lower leg, in any panel."
  - "Do not draw Lame Grandpa's saber unsheathed or in his hand on this page."
  - "Do not show any moon, stars, lanterns, torches, or campfires as a light source."
  - "Do not draw a visible infant anywhere on this page."
