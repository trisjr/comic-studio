# AI Coding
# ch01_page002.yaml
# Chương 1 — trang 2/11. Tiếng trẻ khóc ngoài thôn; ba lão nhân tranh nhau vác tượng đá.
# panel_index 6–10 (tuần tự toàn chương).

page:
  page_id: "ch01_page002"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "A baby is crying outside the safe ring. Three crippled elders argue over
     who gets to walk into the dark, and the one-armed one wins by lifting a
     statue no whole man could lift."

  overall_mood:
    "urgent, bickering, stubborn courage under real fear"

  layout:
    type: "multi_panel"
    panel_count: 5
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_10"
    rows:
      - { row: 1, y: 0.00, h: 0.20, panels: ["panel_06"] }
      - { row: 2, y: 0.20, h: 0.24, panels: ["panel_07", "panel_08"] }
      - { row: 3, y: 0.44, h: 0.20, panels: ["panel_09"] }
      - { row: 4, y: 0.64, h: 0.36, panels: ["panel_10"] }

  continuity:
    setting:
      "A tiny remote mountain village of low mud-and-thatch houses, ringed by four
       ancient weathered stone statues standing one at each corner of the settlement.
       Bare packed-earth paths, a few crooked trees, mountains closing in on all sides."
    time_span:
      "One continuous argument lasting under a minute, at the foot of the nearest
       corner statue."
    spatial:
      "Granny Si holds the left / near side, Elder Ma the right / far side, and
       Lame Grandpa enters from the far right behind Elder Ma. This order is
       never reversed."
    environment:
      "Full night. The four corner statues give off a faint pale glow, weak and
       short-reaching; beyond them the darkness is absolute. The air is dead
       silent apart from a thin infant cry coming from somewhere outside the village."
    wardrobe:
      "All three characters keep identical hairstyle, outfit, and accessories in every panel."
    progression:
      - "panel_06: dialogue. Elder Ma denies hearing anything, then hears it."
      - "panel_07: dialogue. Granny Si announces she is going out; Elder Ma calls her mad."
      - "panel_08: action. Granny Si tries to shoulder the corner statue and cannot — her back is bent."
      - "panel_09: dialogue. Elder Ma offers to carry it and walk with her."
      - "panel_10: action. Lame Grandpa volunteers instead; Elder Ma hoists the statue with his single arm to settle it."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


