# AI Coding
# ch01_page004.yaml
# Chương 1 — trang 4/11. Cái giỏ ở bờ sông và cánh tay người chết đỡ nó lên.
# panel_index 15–20 (tuần tự toàn chương).

page:
  page_id: "ch01_page004"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "Find the source of the crying — and find that the basket is being held out
     of the water by a drowned woman who will not let go until she is told the
     child is safe."

  overall_mood:
    "eerie, mournful, a quiet supernatural grief under the horror"

  layout:
    type: "multi_panel"
    panel_count: 6
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_18"
    rows:
      - { row: 1, y: 0.00, h: 0.20, panels: ["panel_15"] }
      - { row: 2, y: 0.20, h: 0.18, panels: ["panel_16", "panel_17"] }
      - { row: 3, y: 0.38, h: 0.34, panels: ["panel_18"] }
      - { row: 4, y: 0.72, h: 0.28, panels: ["panel_19", "panel_20"] }

  continuity:
    setting:
      "The bank of a wide slow river about a hundred paces from Canlao Village, with
       reeds and wet stones at the waterline and the far bank invisible in the dark."
    time_span:
      "A few minutes at the waterline, from arrival to the moment the body lets go."
    spatial:
      "The river runs across the lower right of every wide panel. Granny Si works
       at the waterline on the left / near side, Elder Ma stands further up the
       bank on the right / far side. This relationship is never reversed."
    environment:
      "Darkness broken by two weak light sources: the carried stone statue set down
       on the bank and a faint green fluorescence coming from a woven basket at the
       water's edge. The river runs black and carries away whatever it takes."
    wardrobe:
      "All characters keep identical hairstyle, outfit, and accessories in every panel."
    progression:
      - "panel_15: establishing. The two reach the waterline and see a small green light among the reeds."
      - "panel_16: reaction. Granny Si's eyes catch the green fluorescence."
      - "panel_17: detail. The woven basket sits upright at the waterline, glowing faintly from inside."
      - "panel_18: reveal. She pulls at the basket and it will not come — a drowned woman's pale arm is holding it up."
      - "panel_19: dialogue. She tells the body the child is safe, and the hand opens."
      - "panel_20: reveal. Inside the swaddle: a newborn boy beside a glowing jade pendant."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


