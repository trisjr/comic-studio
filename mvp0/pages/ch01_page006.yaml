# panel_index 27–31 (tuần tự toàn chương).

page:
  page_id: "ch01_page006"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "Jump eleven years and open the shutters — the first daylight in the chapter,
     a boy on a cow playing a flute. Then the cow says his name."

  overall_mood:
    "bright and idyllic for three panels, then wrong in a way daylight cannot fix"

  layout:
    type: "multi_panel"
    panel_count: 5
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_27"
    rows:
      - { row: 1, y: 0.00, h: 0.40, panels: ["panel_27"] }
      - { row: 2, y: 0.40, h: 0.22, panels: ["panel_28"] }
      - { row: 3, y: 0.62, h: 0.20, panels: ["panel_29", "panel_30"] }
      - { row: 4, y: 0.82, h: 0.18, panels: ["panel_31"] }

  continuity:
    setting:
      "The same riverbank in broad daylight — a green grazing meadow along the water,
       blue-green mountains layered into the distance, clear sky with high white clouds."
    time_span:
      "A single unbroken midday, from a quiet grazing hour to the moment the cow speaks."
    spatial:
      "The river runs along the right / far side of the meadow. Qin Mu stays on the
       left / near side of the cow. This relationship is never reversed."
    environment:
      "Bright open daylight, the exact opposite of every night scene so far. The air is
       clear, the grass moves in a light breeze, the river runs bright. Nothing
       threatening is visible anywhere in frame."
    wardrobe:
      "Qin Mu keeps the same half-open hemp tunic, cloth belt, bare feet and jade
       pendant in every panel; the cow keeps the same braided cloth nose rope."
    progression:
      - "panel_27: establishing. Qin Mu rides the cow across the meadow, playing a bamboo flute."
      - "panel_28: detail. The flute at his lips and the jade pendant on his bare chest."
      - "panel_29: shock. The cow's mouth moves and forms his name."
      - "panel_30: action. He throws himself off the cow's back and lands in the grass."
      - "panel_31: dialogue. The cow turns its head, eyes brimming, and asks him to save it."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


