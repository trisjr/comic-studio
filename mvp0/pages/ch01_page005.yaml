    text_safe_zone:
      - { x: 0.05, y: 0.74, w: 0.90, h: 0.22 }

    typeset:
      dialogue:
        - speaker: "tu_ba_ba"
          text: "Only this pendant. One character carved on it, no papers. And there is something strange inside the stone."
          bubble_type: "speech"
