# AI Coding
# ch01_page005.yaml
# Chương 1 — trang 5/11. Thôn tàn tật nhận nuôi một đứa trẻ lành lặn; đặt tên Tần Mục.
# panel_index 21–26 (tuần tự toàn chương).

page:
  page_id: "ch01_page005"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "A village of cripples claims a whole child. Granny Si refuses to give him
     up, and the limbless chief settles it by giving him a name and a trade."

  overall_mood:
    "communal, prickly, unexpectedly tender under the hard talk"

  layout:
    type: "multi_panel"
    panel_count: 6
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_24"
    rows:
      - { row: 1, y: 0.00, h: 0.18, panels: ["panel_21"] }
      - { row: 2, y: 0.18, h: 0.20, panels: ["panel_22", "panel_23"] }
      - { row: 3, y: 0.38, h: 0.34, panels: ["panel_24"] }
      - { row: 4, y: 0.72, h: 0.28, panels: ["panel_25", "panel_26"] }

  continuity:
    setting:
      "A tiny remote mountain village of low mud-and-thatch houses, ringed by four
       ancient weathered stone statues standing one at each corner of the settlement.
       Bare packed-earth paths, a few crooked trees, mountains closing in on all sides."
    time_span:
      "One gathering in the village square, lasting a few minutes, still deep in
       the same night."
    spatial:
      "Granny Si holds the left / near side of the square with the basket. The
       village chief is carried in from the right / far side on his stretcher.
       This relationship is never reversed."
    environment:
      "Full night inside the ring. The corner statues give off a faint pale glow that
       reaches the middle of the square and dies. A crowd of village elders stands
       around the edges as unlit silhouettes with no readable faces."
    wardrobe:
      "All characters keep identical hairstyle, outfit, and accessories in every panel."
    progression:
      - "panel_21: establishing. Granny Si walks back into the square with the basket; silhouettes close in around her."
      - "panel_22: reveal. She folds back the swaddle and grins — the child is whole."
      - "panel_23: dialogue. She snarls down an offscreen suggestion that the child be given away."
      - "panel_24: entrance. The limbless village chief is carried in on his bamboo stretcher and the arguing stops."
      - "panel_25: detail. She turns the jade pendant over: one carved character, no papers."
      - "panel_26: naming. The chief gives the boy a surname, a name, and a future as a cowherd."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


