    emphasis: "medium"
    character_count: 1

    scene_delta:
      "The village square. A ring of village elders closes in from both edges as
       unlit background silhouettes — bent backs, missing limbs, crutches — none
       of them with a readable face."

    characters:
      - character_id: "tu_ba_ba"
        position: "center, walking in from frame left"
        pose: "hunched, the woven basket clutched against her chest"
        action: "carrying the basket back into the square"
        facial_expression: "guarded, chin up, three-quarter view"
        gaze: "straight ahead through the crowd"
        emotion: "possessive defiance"

    camera:
      shot_type: "wide establishing shot"
      camera_angle: "eye level"
      camera_position: "at the far side of the square, level with the crowd"
      perspective: "moderate depth, houses receding on both sides"
      composition:
        "Granny Si small at center inside a corridor of dark silhouettes; the
         green glow from the basket is the brightest point in the panel."
      focal_point: "the glow at her chest"

    lighting:
      source: "faint pale glow from the four corner stone statues, plus green light from the basket"
      direction: "statue light from both sides, green light from the basket itself"
      intensity: "low"
      shadow: "the surrounding villagers reduced to flat black shapes"

    effects:
      atmosphere: "breath faintly visible in the cold air"

    text_safe_zone:
