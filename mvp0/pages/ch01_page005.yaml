# ============================================================
# NEGATIVE CONSTRAINTS
# ============================================================

negative_constraints:
  - "Do not render any letters, words, speech bubbles, captions, or sound-effect lettering."
  - "Do not render the carving on the pendant as legible text or a readable glyph — show it only as an indistinct carved mark lost in the glow."
  - "Do not place faces or focal detail inside any text_safe_zone."
  - "Do not change character identity, hairstyle, outfit, or accessories between panels."
  - "Do not give any background villager a readable face, and do not give any of them the three named characters' silhouette cues."
  - "Do not draw the village chief with arms, legs, stumps in motion, or standing upright at any point."
  - "Do not show any moon, stars, lanterns, torches, or campfires as a light source."
  - "Do not draw Elder Ma, Lame Grandpa, or any cow on this page."
