    relative_height: 0.28
    shape: "medium vertical panel"
    beat_type: "detail"
    emphasis: "medium"
    character_count: 1

    scene_delta:
      "Close on her hands turning the pale jade pendant over. It is flawless, with
       one carved character on its face and a faint green light inside the stone."

    characters:
      - character_id: "tu_ba_ba"
        position: "hands and lower face only, upper frame"
        pose: "both hands cupped, thumbs turning the pendant over"
        action: "examining the pendant for anything else that identifies him"
        facial_expression: "only the mouth and chin visible, lips pursed"
        gaze: "down at the pendant"
        emotion: "calculation"

    camera:
