        position: "upper left, leaning over the basket"
        pose: "bent over the basket, one hand holding the swaddle back"
        action: "checking the child and finding him whole"
        facial_expression: "wide gap-toothed grin breaking across her face"
        gaze: "down into the basket"
        emotion: "triumph"

      - character_id: "tan_muc_so_sinh"
        position: "lower right, in the basket"
        pose: "lying on his back, both arms free of the cloth"
        action: "kicking and laughing up at her"
        facial_expression: "toothless laugh, cheeks still wet"
        gaze: "up at Granny Si"
        emotion: "delight"

    camera:
      shot_type: "medium close-up"
      camera_angle: "high angle over the basket"
      camera_position: "just above and beside Granny Si's shoulder"
      perspective: "compressed, both faces on nearly the same plane"
      composition:
        "The two faces on a diagonal, the basket rim cutting the lower corner."

    lighting:
      source: "green glow from the jade pendant in the basket"
      direction: "uplight onto Granny Si's face"
      intensity: "low and close"
      shadow: "her eye sockets deeply shadowed by the uplight"

    effects:
