        - speaker: "truong_thon"
          text: "Let the surname be Qin, then. Call him Mu. When he grows, put him out to herd — that much will keep him fed."
          bubble_type: "speech"
      sfx: []

    panel_purpose:
      "Close the flashback on the naming, and put the two people who decide his
       life in the same frame as the child."


