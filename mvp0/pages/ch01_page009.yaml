# AI Coding
# ch01_page009.yaml
# Chương 1 — trang 9/11. "Về đi, về đi" — rồi ném xác xuống sông như việc thường ngày.
# panel_index 43–46 (tuần tự toàn chương).

page:
  page_id: "ch01_page009"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "The old man pats the boy's shoulder and sends him home. Qin Mu looks back
     once and sees the body go into the river — routine, unhurried, no ceremony."

  overall_mood:
    "warm on the surface, cold underneath; the horror is how ordinary it looks"

  layout:
    type: "multi_panel"
    panel_count: 4
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_45"
    rows:
      - { row: 1, y: 0.00, h: 0.24, panels: ["panel_43"] }
      - { row: 2, y: 0.24, h: 0.22, panels: ["panel_44"] }
      - { row: 3, y: 0.46, h: 0.34, panels: ["panel_45"] }
      - { row: 4, y: 0.80, h: 0.20, panels: ["panel_46"] }

  continuity:
    setting:
      "The same riverbank in broad daylight — a green grazing meadow along the water,
       blue-green mountains layered into the distance, clear sky with high white clouds."
    time_span:
      "A few minutes, continuous, as the boy walks from the hide toward the village path."
    spatial:
      "Qin Mu moves from right to left across the page, away from the river. Lame
       Grandpa and the body stay on the right / far side near the water. This
       relationship is never reversed."
    environment:
      "Bright open daylight with short soft shadows on the grass. An empty cowhide
       lies flat on the grass, cut open and completely bloodless. The river runs
       bright at the far edge and takes whatever is put into it."
    wardrobe:
      "All characters keep identical hairstyle, outfit, and accessories in every panel."
    progression:
      - "panel_43: dialogue. Lame Grandpa slaps the boy's shoulder, laughing, and tells him to go home."
      - "panel_44: reaction. Qin Mu walks away unsteadily, legs not quite working."
      - "panel_45: reveal. He looks back and sees the old man swinging the body into the river."
      - "panel_46: transition. The empty hide alone on the grass; the water already smooth again."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


