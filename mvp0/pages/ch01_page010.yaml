  - "Do not show any moon, stars, lanterns, torches, or campfires as a light source."
  - "Do not render anything visible inside the darkness beyond the statue glow."
  - "Do not draw a cow, a cowhide, a sickle, or any flashback inset on this page."
  - "Do not make the jade pendant glow brightly enough to light Qin Mu's face."
