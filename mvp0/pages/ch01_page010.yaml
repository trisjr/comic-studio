# Chương 1 — trang 10/11. Tư bà bà thản nhiên nhận đã biến một người thành bò.
# panel_index 47–51 (tuần tự toàn chương).

page:
  page_id: "ch01_page010"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "Night closes the village again. Qin Mu finally asks why, and Granny Si
     answers by admitting, without a flicker, that she turned a woman into a cow
     — then offers to teach him how."

  overall_mood:
    "domestic, wry, and quietly monstrous"

  layout:
    type: "multi_panel"
    panel_count: 5
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_51"
    rows:
      - { row: 1, y: 0.00, h: 0.22, panels: ["panel_47"] }
      - { row: 2, y: 0.22, h: 0.22, panels: ["panel_48", "panel_49"] }
      - { row: 3, y: 0.44, h: 0.20, panels: ["panel_50"] }
      - { row: 4, y: 0.64, h: 0.36, panels: ["panel_51"] }

  continuity:
    setting:
      "A tiny remote mountain village of low mud-and-thatch houses, ringed by four
       ancient weathered stone statues standing one at each corner of the settlement.
       Bare packed-earth paths, a few crooked trees, mountains closing in on all sides."
    time_span:
      "One conversation of a few minutes, beginning the moment the statues light up."
    spatial:
      "Granny Si holds the left / near side of the frame, Qin Mu the right / far
       side. This relationship is never reversed."
    environment:
      "Nightfall inside the ring. The four corner statues have lit again and give off
       a faint pale glow, weak and short-reaching; beyond them the darkness is
       absolute. The air is completely still and silent."
    wardrobe:
      "Both characters keep identical hairstyle, outfit, and accessories in every panel."
    progression:
      - "panel_47: establishing. Darkness lands on the village and the four corner statues light up on their own."
      - "panel_48: dialogue. Granny Si hauls Qin Mu back by the collar before he can slip out toward the river."
      - "panel_49: dialogue. He asks the question the whole chapter has avoided."
      - "panel_50: reaction. She looks out past the statues, worried about the one-legged man still outside."
      - "panel_51: dialogue. She admits what she did to the woman, and offers to teach him the same thing."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


