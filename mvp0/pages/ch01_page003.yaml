# AI Coding
# ch01_page003.yaml
# Chương 1 — trang 3/11. Ra khỏi vùng bảo hộ; bóng tối có thứ sống trong đó.
# panel_index 11–14 (tuần tự toàn chương).

page:
  page_id: "ch01_page003"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "Step outside the ring of statues and prove the rule true — the dark is
     inhabited, and the only reason the two elders survive it is the stone on
     Elder Ma's back."

  overall_mood:
    "claustrophobic, predatory, a single fragile bubble of light in total black"

  layout:
    type: "multi_panel"
    panel_count: 4
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_13"
    rows:
      - { row: 1, y: 0.00, h: 0.24, panels: ["panel_11"] }
      - { row: 2, y: 0.24, h: 0.22, panels: ["panel_12"] }
      - { row: 3, y: 0.46, h: 0.34, panels: ["panel_13"] }
      - { row: 4, y: 0.80, h: 0.20, panels: ["panel_14"] }

  continuity:
    setting:
      "The open ground between Canlao Village and the river at night — a rough dirt
       track, scattered rocks and low scrub, with no landmark visible beyond a few paces."
    time_span:
      "A few minutes of walking, covering roughly a hundred paces from the village
       gate toward the river."
    spatial:
      "Granny Si walks on the left / near side, Elder Ma on the right / far side
       with the statue on his back. This relationship is never reversed."
    environment:
      "Total darkness in every direction. The only light travels with the characters:
       an ancient stone statue carried out of the village. Unseen things circle just
       outside that light and retreat whenever the glow touches them."
    wardrobe:
      "Both characters keep identical hairstyle, outfit, and accessories in every panel."
    progression:
      - "panel_11: establishing. The two step past the last house and the village light is gone behind them."
      - "panel_12: suspense. Half-seen shapes crowd the outer edge of the moving pool of glow."
      - "panel_13: action. The glow sweeps across one of them and it recoils out of the light."
      - "panel_14: transition. The two press on toward the sound of crying, backs to the viewer."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


