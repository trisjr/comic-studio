# ============================================================
# NEGATIVE CONSTRAINTS
# ============================================================

negative_constraints:
  - "Do not render any letters, words, speech bubbles, captions, or sound-effect lettering."
  - "Do not place faces or focal detail inside any text_safe_zone."
  - "Do not change character identity, hairstyle, outfit, or accessories between panels."
  - "Do not swap the silhouette cues: only Granny Si has the hunched back and indigo tunic, only Elder Ma has the knotted empty left sleeve."
  - "Do not give Elder Ma a left arm or a visible left hand in any panel."
  - "Do not draw any fully resolved creature: no readable eyes, teeth, limbs, or body plan on the things in the dark."
  - "Do not show any moon, stars, lanterns, torches, or campfires as a light source."
  - "Do not draw the village, its houses, or any other statue after panel_11."
