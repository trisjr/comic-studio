# ============================================================
# PANELS
# ============================================================

panels:

  # ---------------------------------------------------------- PANEL 11
  - id: "panel_11"
    panel_index: 11
    row: 1
    column: 1
    relative_width: 1.0
    relative_height: 0.24
    shape: "wide cinematic horizontal panel"
    beat_type: "establishing"
    emphasis: "medium"
    character_count: 2

    scene_delta:
      "The last mud wall of the village slides past at the extreme left edge.
       Everything to the right of the two figures is undifferentiated black."

    characters:
      - character_id: "tu_ba_ba"
        position: "left of center, walking"
        pose: "hunched forward, small quick steps"
        action: "leading the way out of the village"
        facial_expression: "set and grim, three-quarter view"
        gaze: "straight ahead into the dark"
        emotion: "determination"

      - character_id: "ma_lao"
        position: "right of center, half a pace behind"
        pose: "leaning forward under the weight, statue roped across his back"
        action: "carrying the glowing statue out past the boundary"
        facial_expression: "jaw locked, breathing hard"
        gaze: "down at the track"
        emotion: "strain"

    camera:
      shot_type: "wide tracking shot"
      camera_angle: "eye level"
      camera_position: "level with the track, slightly ahead of the pair"
      perspective: "shallow — nothing is visible far enough away to give depth"
      composition:
        "Both figures held in the lower left half inside a small oval of light;
         the right half of the panel is solid black."
      focal_point: "the edge where the glow stops"

    lighting:
      source: "a single moving pool of pale glow from the carried stone statue"
      direction: "radiating from Elder Ma's back"
      intensity: "low, reaching only a few paces"
      shadow: "hard black beyond the pool, with no falloff gradient"

    effects:
      atmosphere: "the black reads as opaque and close, like a wall rather than distance"

    text_safe_zone:
      - { x: 0.60, y: 0.08, w: 0.36, h: 0.55 }

    typeset:
      dialogue: []
      sfx: []

    panel_purpose:
      "Sell the scale of the risk: the safe zone is now behind them and the light
       they have is the size of a room."


  # ---------------------------------------------------------- PANEL 12
  - id: "panel_12"
    panel_index: 12
    row: 2
    column: 1
    relative_width: 1.0
    relative_height: 0.22
    shape: "wide horizontal panel"
    beat_type: "suspense"
    emphasis: "medium"
    character_count: 0

    scene_delta:
      "No characters in frame. Only the outer rim of the moving pool of light on
       the dirt track, and half-seen shapes crowding just outside it — suggested
       by wet highlights and broken contours, never fully drawn."

    characters: []

    camera:
      shot_type: "wide detail shot"
      camera_angle: "low angle, close to the ground"
      camera_position: "at the outer edge of the light pool, looking outward into the dark"
      perspective: "flattened, no horizon"
      composition:
        "A curved band of dim ground across the bottom third, the rest black with
         only fragmentary highlights implying bodies."
      focal_point: "the boundary line where light stops"

    lighting:
      source: "the receding pale statue glow, from behind the camera"
      direction: "from behind, raking away"
      intensity: "very low at this distance"
      shadow: "everything past the band unreadable"

    effects:
      atmosphere: "scattered scrub and rocks partly lit, shapes between them left ambiguous"

    text_safe_zone:
      - { x: 0.10, y: 0.05, w: 0.80, h: 0.30 }

    typeset:
      dialogue: []
      sfx: []

    panel_purpose:
      "Let the reader's eye do the work — imply a crowd of watchers without
       committing to a monster design."


  # ---------------------------------------------------------- PANEL 13
  - id: "panel_13"
    panel_index: 13
    row: 3
    column: 1
    relative_width: 1.0
    relative_height: 0.34
    shape: "large dominant action panel"
    beat_type: "action"
    emphasis: "large"
    character_count: 2

    scene_delta:
      "Elder Ma turns and the statue swings with him, sweeping the pool of light
       sideways across the scrub. One of the shapes is caught in the glow and
       flinches backward out of frame, leaving only a blurred contour."

    characters:
      - character_id: "ma_lao"
        position: "center right, mid-turn"
        pose: "twisting his torso, single right arm bracing the statue on his back"
        action: "swinging the statue's light toward the thing beside the track"
        facial_expression: "snarling, eyes wide"
        gaze: "toward the fleeing shape at frame left"
        emotion: "aggression over fear"

      - character_id: "tu_ba_ba"
        position: "foreground left, low"
        pose: "dropped into a crouch, one hand out toward the ground"
        action: "flinching down and away as the light sweeps past her"
        facial_expression: "eyes narrowed, lips pulled back"
        gaze: "at the retreating shape"
        emotion: "cold readiness rather than panic"

    camera:
      shot_type: "dynamic wide shot"
      camera_angle: "low angle"
      camera_position: "on the track just ahead of the pair, tilted"
      perspective: "strong perspective distortion along the swinging light"
      composition:
        "A diagonal wedge of pale light cuts from Elder Ma at upper right down to
         the lower left corner, where the caught shape is dissolving back into black."
      focal_point: "the leading edge of the swung light"

    lighting:
      source: "the carried stone statue, swung hard to one side"
      direction: "sweeping diagonally from upper right to lower left"
      intensity: "low but sharply directional"
      shadow: "long moving shadows thrown by both elders across the scrub"

    effects:
      motion: "arc-shaped motion smear following the statue's swing"
      creature: "a single retreating contour at the light's edge, deliberately unresolved"

    text_safe_zone:
      - { x: 0.62, y: 0.04, w: 0.34, h: 0.22 }

    typeset:
      dialogue: []
      sfx:
        - "SKREE"

    panel_purpose:
      "Prove the folk rule is literal — the statue light is a weapon, and things
       out here are afraid of it."


  # ---------------------------------------------------------- PANEL 14
  - id: "panel_14"
    panel_index: 14
    row: 4
    column: 1
    relative_width: 1.0
    relative_height: 0.20
    shape: "wide horizontal panel"
    beat_type: "transition"
    emphasis: "small"
    character_count: 2

    scene_delta:
      "Both figures seen from behind, walking away down the track. The pool of
       light goes with them and the foreground falls back into black."

    characters:
      - character_id: "tu_ba_ba"
        position: "left of center, small, back to the viewer"
        pose: "hunched, walking away"
        action: "following the crying toward the river"
        facial_expression: "not visible — seen entirely from behind"
        gaze: "away from the viewer"
        emotion: "reads through posture only"

      - character_id: "ma_lao"
        position: "right of center, back to the viewer"
        pose: "bent under the roped statue, walking away"
        action: "carrying the light forward"
        facial_expression: "not visible — seen entirely from behind"
        gaze: "away from the viewer"
        emotion: "reads through posture only"

    camera:
      shot_type: "wide following shot"
      camera_angle: "eye level"
      camera_position: "behind and slightly above the pair, on the track"
      perspective: "one-point perspective down the dirt track"
      composition:
        "The two backs centered small in a shrinking oval of light, surrounded on
         all four sides by black."
      focal_point: "the glow on the statue between Elder Ma's shoulders"

    lighting:
      source: "the carried stone statue, now facing away from the viewer"
      direction: "away from camera"
      intensity: "low and shrinking"
      shadow: "the two figures read as dark cut-outs against their own light"

    effects:
      atmosphere: "the darkness closing behind them across the foreground"

    text_safe_zone:
      - { x: 0.05, y: 0.55, w: 0.35, h: 0.35 }

    typeset:
      dialogue: []
      sfx: []

    panel_purpose:
      "Hand the page off to the riverbank, and reinforce that the camera does not
       get to see faces out here."


