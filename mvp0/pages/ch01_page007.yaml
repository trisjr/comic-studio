# AI Coding
# ch01_page007.yaml
# Chương 1 — trang 7/11. Lột da bò: không máu, bên trong rỗng, một người phụ nữ trút ra.
# panel_index 32–36 (tuần tự toàn chương).
# ⭐ panel_35: con bò KHÔNG còn là nhân vật có mặt — nó là tấm da rỗng đang bị
#    trút ra, nên nằm ở scene_delta chứ không nằm trong `characters`.

page:
  page_id: "ch01_page007"
  aspect_ratio: "2:3"
  target_resolution: "1024x1536"
  reading_direction: "left_to_right"

  purpose:
    "The boy skins the animal that raised him. There is no blood, the hide is
     hollow, and what comes out of it is a woman."

  overall_mood:
    "queasy, clinical, body-horror staged in full sunlight"

  layout:
    type: "multi_panel"
    panel_count: 5
    gutter: "thin white gutters with clean black panel borders"
    dominant_panel: "panel_35"
    rows:
      - { row: 1, y: 0.00, h: 0.20, panels: ["panel_32"] }
      - { row: 2, y: 0.20, h: 0.22, panels: ["panel_33", "panel_34"] }
      - { row: 3, y: 0.42, h: 0.36, panels: ["panel_35"] }
      - { row: 4, y: 0.78, h: 0.22, panels: ["panel_36"] }

  continuity:
    setting:
      "The same riverbank in broad daylight — a green grazing meadow along the water,
       blue-green mountains layered into the distance, clear sky with high white clouds."
    time_span:
      "A few minutes, continuous, in the same patch of meadow."
    spatial:
      "Qin Mu stays on the left / near side of the frame; the animal and whatever
       comes out of it stay on the right / far side. This relationship is never reversed."
    environment:
      "Bright open daylight with short soft shadows on the grass. The river runs
       bright at the far edge. The cut hide produces no blood and stains nothing."
    wardrobe:
      "Qin Mu keeps the same half-open hemp tunic, cloth belt, bare feet and jade
       pendant in every panel."
    progression:
      - "panel_32: dialogue. The cow tells him where the sickle is and what to do with it."
      - "panel_33: action. He makes the first careful cut along the hide."
      - "panel_34: detail. The cut lips open on nothing — no blood, no flesh, no bone."
      - "panel_35: reveal. The hide is peeled down to the waist and a woman is coming out of it, legs still sealed inside."
      - "panel_36: action. She snatches the sickle from his hand and finishes the job herself."

text_policy:
  render_text_in_image: false
  rule:
    "Do not draw any letters, words, speech bubbles, captions, or sound-effect
     lettering. Dialogue and SFX are typeset later in a separate overlay stage.
     Keep each panel's text_safe_zone visually calm: no faces, no focal detail."


