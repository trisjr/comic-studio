# ============================================================
# NEGATIVE CONSTRAINTS
# ============================================================

negative_constraints:
  - "Do not render any letters, words, speech bubbles, captions, or sound-effect lettering."
  - "Do not place faces or focal detail inside any text_safe_zone."
  - "Do not change character identity, hairstyle, outfit, or accessories between panels."
  - "Do not draw a living, standing, or head-raised cow in panel_35 or panel_36 — from panel_35 onward the hide is an empty object on the ground."
  - "Do not draw blood, viscera, exposed muscle, bone, or wet tissue anywhere on this page."
  - "Do not draw the woman nude — the ragged damp silk inner robe is always present and covers her."
  - "Do not give the cow human limbs, human teeth, or an anthropomorphic posture in panel_32 through panel_34."
  - "Do not add other cattle, villagers, birds, or any second animal to the meadow."
