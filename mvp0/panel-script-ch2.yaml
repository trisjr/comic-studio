# AI Coding
# panel-script-ch2.yaml
# Panel script VIET TAY cho MVP0 — chuong comic #2, 20 panel / 6 trang.
# Tiep noi panel-script-ch1.yaml, hoan tat chuong chu 1.
#
# ⚠️ ⭐ BANG CHUNG SONG CHO F-8 — doc truoc khi nap vao schema:
#   `page_no` o day chay TIEP TUC 7..12, ⛔ KHONG reset ve 1. Ly do co hoc:
#   `comic.page` co UNIQUE (tenant_id, chapter_id, page_no) va `chapter_id`
#   tro ve `story.chapter` — tuc CHUONG CHU. Hai chuong comic cung mot chuong
#   chu ⇒ buoc phai dung chung day so trang.
#   ⇒ Nguoi doc se thay "chuong 2 bat dau tu trang 7". Neu Architect quyet
#   them mot entity chuong comic (Q-6), day so nay reset ve 1..6 va file nay
#   phai sua theo. Ghi lai de quyet dinh do co du lieu that de doi chieu.

meta:
  chuong_comic: 2
  tong_panel: 20
  tong_trang: 6
  page_no_range: "7-12 (xem canh bao F-8 o tren)"
  emphasis_da_dung:
    full_page: 1   # panel 42
    large: 3       # panel 24, 29, 33
  ngan_sach_uoc_tinh: "20 panel x N=3 = 60 anh x $0.134 ~= $8.04"
  ngan_sach_ca_chuong_chu: "42 panel x N=3 = 126 anh ~= $16.88 — ⚠️ vuot ~$12, duoi tran thuc te ~$50"

# ⚠️ Hai nhan vat NEN xuat hien o panel 39-40 (ong lao, co gai) ⛔ KHONG co
# trong story-bible.yaml. Day la CHU Y: ho xuat hien DUNG MOT panel, khong tai
# xuat hien ⇒ ⛔ khong do duoc consistency, nen ⛔ khong can canonical reference.
# Consistency chi do duoc voi nhan vat XUAT HIEN NHIEU LAN.

