boi_canh:

  # ---------------------------------------------------------- Tàn Lão thôn về đêm
  - id: "tan_lao_thon_dem"
    ten: "Tàn Lão thôn về đêm"
    ten_en: "Canlao Village at Nightfall"
    setting_en:
      "A tiny remote mountain village of low mud-and-thatch houses, ringed by four
       ancient weathered stone statues standing one at each corner of the settlement.
       Bare packed-earth paths, a few crooked trees, mountains closing in on all sides."
    environment_en:
      "The scene runs from the last sliver of sunset behind the mountains into full
       darkness: as the final light dies the world falls completely silent and the four
       corner statues begin to give off a faint pale glow. Beyond the statues' reach the
       darkness is absolute and something moves inside it. The statue glow is the
       dominant state of this setting."
    lighting_default_en:
      "faint pale glow from the four corner stone statues, weak and short-reaching,
       everything beyond them in flat black"
    props_en:
      - "four ancient weathered stone statues, one at each corner of the village, mottled with age"
      - "low mud-and-thatch houses with sagging roofs"
      - "a carried bamboo stretcher for the village chief"
      - "bare packed-earth village paths"
      - "a wall of absolute darkness pressing in just beyond the statue glow"

  # ---------------------------------------------------------- Ngoài thôn trong bóng tối
  - id: "ngoai_thon_bong_toi"
    ten: "Ngoài thôn trong bóng tối"
    ten_en: "Outside the Village, in the Dark"
    setting_en:
      "The open ground between Canlao Village and the river at night — a rough dirt
       track, scattered rocks and low scrub, with no landmark visible beyond a few paces."
    environment_en:
      "Total darkness in every direction. The only light travels with the characters:
       an ancient stone statue carried out of the village. Unseen things circle just
       outside that light and retreat with a shrill chittering whenever the glow
       touches them."
    lighting_default_en:
      "a single moving pool of pale glow from the carried stone statue, reaching only
       a few paces, hard black beyond it"
    props_en:
      - "an ancient stone statue carried on a man's back, glowing faintly"
      - "rough dirt track with scattered rocks and low scrub"
      - "half-seen shapes retreating at the very edge of the glow"
      - "absolute black void filling the rest of the frame"

  # ---------------------------------------------------------- Bờ sông về đêm
  - id: "bo_song_dem"
    ten: "Bờ sông về đêm"
    ten_en: "Riverbank at Night"
    setting_en:
      "The bank of a wide slow river about a hundred paces from Canlao Village, with
       reeds and wet stones at the waterline and the far bank invisible in the dark."
    environment_en:
      "Darkness broken by two weak light sources: the carried stone statue and a faint
       green fluorescence coming from a woven basket at the water's edge. A newborn is
       crying inside the basket. The river runs black and carries away whatever it takes."
    lighting_default_en:
      "weak pale statue glow from one side, faint green fluorescence rising from the
       basket at the waterline"
    props_en:
      - "a woven river basket at the waterline with a faint green glow inside"
      - "a drowned woman's pale waterlogged arm rising from the river, holding the basket upright"
      - "long black hair drifting on the black water surface"
      - "wet stones and reeds along the waterline"
      - "an ancient stone statue set down on the bank, glowing faintly"

  # ---------------------------------------------------------- Bờ sông ban ngày
  - id: "bo_song_ngay"
    ten: "Bờ sông ban ngày"
    ten_en: "Riverbank by Day"
    setting_en:
      "The same riverbank in broad daylight — a green grazing meadow along the water,
       blue-green mountains layered into the distance, clear sky with high white clouds."
    environment_en:
      "Bright open daylight, the exact opposite of every night scene in the chapter.
       The air is clear, the grass moves in a light breeze, the river runs bright.
       Nothing threatening is visible anywhere in frame."
    lighting_default_en:
      "high clear midday sunlight, warm and even, short soft shadows on the grass"
    props_en:
      - "a bamboo flute"
      - "a short curved harvesting sickle"
      - "an empty cowhide lying flat on the grass, cut open and completely bloodless"
      - "layered blue-green mountains under high white clouds"
      - "grazing meadow grass running down to the water"

