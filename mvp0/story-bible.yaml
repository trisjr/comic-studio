# AI Coding
# story-bible.yaml
# Story Bible VIET TAY cho MVP0 — 3 nhan vat, mot chuong duy nhat.
# Nguon: "Ta Nguyet Vo Tan" Chuong 1 (Nguoi chet tro ve).
# Rang buoc: Roadmap §3.1 — "Story Bible cho 2-3 nhan vat VIET TAY".
# ⛔ KHONG co database o MVP0 (MVP-Scope §3.1, o A5 = ❌). File phang la dung.

meta:
  tac_pham: "Tà Nguyệt Vô Tận"
  chuong_chu: 1
  ten_chuong: "Người chết trở về"
  chuong_comic: 1
  ghi_chu_don_vi: >
    Chuong chu 1 duoc tach thanh HAI chuong comic. File nay phuc vu chuong
    comic #1 (nghia dia -> tinh day -> bia da -> flashback -> ky hieu con mat).
    Xem F-8 trong docs/050-Research/Analysis-MVP0-Requirements.md: don vi
    "chapter" hien nhap nhang giua chuong chu va chuong comic.

nhan_vat:

  - id: lam_uyen
    ten: "Lâm Uyên"
    ten_en: "Lam Uyen"
    vai_tro: "Nhân vật chính"
    tuoi: 17
    canonical_reference:
      khuon_mat: >
        Thiếu niên 17 tuổi, khuôn mặt gầy và tái nhợt, gò má cao, môi mỏng
        không còn sắc máu. Lông mày rậm, sống mũi thẳng.
      toc: >
        Tóc đen dài quá vai, rối và bết thành từng lọn, dính vào hai bên má.
      trang_phuc: >
        Áo dài đen kiểu tu tiên cổ, vạt rách nát từ ngực xuống gấu, ống tay
        toạc một bên. ⭐ Áo là màu ĐEN TUYỀN — không hoa văn, không viền.
      dac_diem_khong_doi: >
        Chân trần. Bàn tay và cổ tay gầy, nổi gân.
    canonical_reference_en:
      khuon_mat: >
        17-year-old slender male xianxia cultivator, gaunt and pale face, high sharp cheekbones,
        thin bloodless pale lips, thick dark sharp eyebrows, straight defined nose bridge.
      toc: >
        Long disheveled messy jet-black hair past shoulders, strands framing both sides of face.
      trang_phuc: >
        Tattered torn black ancient xianxia cultivation robe, shredded from chest to hem,
        one torn sleeve exposing arm, pure solid pitch-black fabric with no patterns.
      dac_diem_khong_doi: >
        Barefoot, slender bony hands with visible veins.
    # ⭐ Moc trang thai — `state_ref` trong panel script tra THANG vao day.
    # Compiler dua noi dung nay vao PRECEDENCE 1 (cung bac voi identity),
    # vi "mac gi o thoi diem nao" chinh la thu G1-a va G1-d do.
    trang_thai_theo_thoi_diem:
      - moc: "truoc_panel_20"
        mo_ta: >
          Áo đen rách nát, tóc dài bết máu khô. Hai mắt đen bình thường.
          Áo rách để lộ vết thương kiếm đã liền sẹo mờ giữa ngực.
        mo_ta_en: >
          Tattered black robe, long messy hair. Normal dark eyes. Torn robe revealing a faint healed sword scar on chest.
      - moc: "tu_panel_20"
        mo_ta: >
          Áo đen rách nát, tóc bết. Hai mắt vẫn đen. ⭐ Vết thương giữa ngực
          BIẾN MẤT, thay bằng KÝ HIỆU CON MẮT màu đen khắc chìm trên da.
        mo_ta_en: >
          Tattered black robe, messy hair. Chest scar disappeared, replaced by a mystical black eye insignia etched on skin.
      - moc: "flashback"
        mo_ta: >
          ⭐ Áo LỤA TÔNG SÁNG mượt còn nguyên vẹn, tóc buộc gọn sau gáy, mặt
          sạch không máu. ⛔ KHÔNG phải áo đen rách. Đây là mốc attribute
          binding quan trọng nhất chương: cùng một người, hai bộ trang phục.
        mo_ta_en: >
          Intact smooth light pastel silk robe, hair neatly tied back, clean face with no blood, young noble appearance.
      - moc: "sau_thuc_tinh"
        mo_ta: >
          Áo đen rách. ⭐ Mắt TRÁI đen, mắt PHẢI ĐỎ NHƯ MÁU — hai màu khác
          nhau. Ký hiệu con mắt trên ngực vẫn còn.
        mo_ta_en: >
          Tattered black robe. Left eye black, right eye glowing crimson blood-red. Black eye insignia on chest.

  - id: lam_phu
    ten: "Lâm phụ (cha của Lâm Uyên)"
    ten_en: "Father Lam"
    vai_tro: "Nhân vật phụ — chỉ xuất hiện trong flashback"
    tuoi: "khoảng 45"
    canonical_reference:
      khuon_mat: >
        Người đàn ông trung niên, râu quai nón cắt ngắn, nếp nhăn sâu giữa
        hai lông mày, mắt trũng.
      toc: "Tóc búi cao, cài trâm gỗ, vài sợi bạc hai bên thái dương."
      trang_phuc: >
        Áo choàng gấm TÔNG SẪM ĐẬM gần đen, cổ áo thêu hoa văn dây leo nổi
        rõ — trang phục gia chủ. ⭐ Tông sẫm đậm là dấu phân biệt với áo
        trắng sáng của nữ nhân.
      vat_pham: >
        ⭐ Tay phải đeo một chiếc nhẫn LỚN mặt đá tròn nổi bật. Vật phẩm
        này PHẢI gắn với nhân vật này, ⛔ không gắn cho người phụ nữ áo trắng.
    canonical_reference_en:
      khuon_mat: >
        Middle-aged authoritative patriarch around 45 years old, short trimmed beard along jawline,
        deep vertical furrow wrinkles between eyebrows, deep-set sharp eyes.
      toc: >
        Black hair neatly tied in a high topknot with an antique wooden hairpin, silver strands at temples.
      trang_phuc: >
        Luxurious deep dark charcoal-brown embroidered silk clan-leader robe, collar embroidered with raised vine motifs.
      vat_pham: >
        Prominent large dark gemstone ring worn on right hand.

  - id: bach_y_nu
    vai_tro: "Kẻ giết Lâm Uyên — chỉ xuất hiện trong flashback"
    ten: "Bạch y nữ (người phụ nữ áo trắng)"
    ten_en: "White-robed swordswoman"
    canonical_reference:
      khuon_mat: >
        Gương mặt lạnh, không biểu cảm. Mắt dài và hẹp, lông mày mảnh.
        Da rất trắng.
      toc: "Tóc đen dài buông thẳng, không trang sức."
      trang_phuc: >
        Áo dài TRẮNG TOÀN BỘ, tay áo rộng, không hoa văn, không thắt lưng màu.
      vat_pham: >
        ⭐ Một thanh trường kiếm lưỡi mỏng, chuôi quấn dây trắng.
        Vật phẩm này PHẢI gắn với nhân vật này, ⛔ không gắn cho Lâm phụ.
    canonical_reference_en:
      khuon_mat: >
        Mysterious ethereal female swordswoman around 25 years old appearance, cold emotionless expression,
        fair porcelain pale skin, long narrow piercing eyes, delicate thin eyebrows.
      toc: >
        Long straight sleek black hair flowing freely down back, no ornaments.
      trang_phuc: >
        Flowing pure spotless pristine white xianxia hanfu robe, wide billowing sleeves, spotless white with no patterns or colored belt.
      vat_pham: >
        Slender thin-bladed Chinese long sword with white ribbon wrapped around the hilt.

# ⛔ KHONG dua vao Story Bible:
#   - "Ta Than": chi la GIONG NOI trong linh hon, khong co than the
#     => khong co canonical reference, khong dem vao character_count.
#   - Con mat khong lo / khuon mat sau tang may: thuc the thi giac,
#     khong co trang phuc hay vat pham => ⛔ KHONG do duoc attribute binding.
#   - Oan hon: dam dong vo danh, khong identity rieng.
# Ba muc tren la LY DO chuong nay truot tieu chi C-1 — xem README.md.

rang_buoc_toan_chuong:
  toi_da_nhan_vat_moi_panel: 3
  bang_mau_chu_dao: "Đen, đỏ máu, xám tro. Flashback: xanh nhạt, nâu sẫm, trắng."
  anh_sang: "Không trăng. Nguồn sáng duy nhất là chớp đỏ trên tầng mây."
