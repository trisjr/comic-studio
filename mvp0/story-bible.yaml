# AI Coding
# story-bible.yaml
# Story Bible cho MVP0 — Danh sách nhân vật (nhan_vat) và bối cảnh (boi_canh) dùng
# chung cho toàn bộ chương truyện. Điền thông tin của chương mới vào đây trước khi
# chạy skill /mvp0-page-prompt để sinh page YAML theo mvp0/prompt-template.txt.
#
# RÀNG BUỘC KỸ THUẬT:
# - Cần tối đa 2-3 nhân vật chính xuất hiện lặp lại để đo Consistency (G1-a, G1-d).
# - Mỗi nhân vật bắt buộc có `id` viết liền không dấu (dùng làm tên file ref:
#   mvp0/refs/<id>.png, đúng bằng `canonical_reference`).
# - BIẾN THỂ NHÂN VẬT (variant) — một nhân vật có nhiều hình dạng theo thời gian
#   (độ tuổi, timeline) hoặc theo biến thân: MỖI hình dạng là MỘT entry riêng ở
#   cấp `nhan_vat`, KHÔNG lồng vào nhau. Lý do: đơn vị mà pipeline tiêu thụ là
#   "thứ có reference image riêng" — scripts/mvp0/run_mvp0.py stage `refs` duyệt
#   phẳng `nhan_vat` và sinh đúng một character sheet cho mỗi entry.
#   Hai trường metadata `nhan_vat_goc` (id nhân vật gốc, dùng để nhóm các biến
#   thể) và `bien_the` (mô tả hình dạng) chỉ dành cho người đọc — script bỏ qua.
#   HỆ QUẢ: mỗi variant tính riêng như một nhân vật độc lập trong giới hạn
#   ≤ 3 `characters` mỗi page (lint L08 báo ERROR nếu vượt) và trong ngân sách
#   2-3 nhân vật lặp lại của G1-d. Các variant có thể cùng xuất hiện một trang
#   BẮT BUỘC có `silhouette_cue_en` khác nhau (lint L08 bắt trùng cue).
# - `canonical_reference_en` PHẢI đủ bốn khóa `khuon_mat`, `mat`, `toc`,
#   `trang_phuc` cho MỌI entry — kể cả biến thân phi nhân (dạng thú) — vì
#   scripts/mvp0/run_mvp0.py::character_sheet_prompt truy cập trực tiếp, thiếu
#   khóa sẽ KeyError.
# - Các trường tiếng Anh (`silhouette_cue_en`, `body_type_relative_en`,
#   `color_language_en`, `personality_en`, và toàn bộ `canonical_reference_en.*`,
#   `setting_en`, `environment_en`, `lighting_default_en`, `props_en`) được skill
#   /mvp0-page-prompt CHIẾU 1:1 (projected 1:1) vào khối CHARACTERS và CONTINUITY
#   của mvp0/prompt-template.txt khi soạn page YAML — KHÔNG qua LLM enhance nào
#   trong script (D-34/SRS-FR-17); scripts/mvp0/compile_prompt.py chỉ serialize
#   page YAML đã soạn sẵn thành text prompt, không tự sinh câu chữ mới.
# - Theo D4: `ten`/`ten_en` được phép dùng trong các trường prose của page YAML
#   (continuity.spatial, composition, panel_purpose...); còn các trường STRUCTURED
#   (characters[].id, panels[].characters[].character_id, typeset.dialogue[].speaker)
#   BẮT BUỘC dùng `id` (character_id), không được dùng tên.

nhan_vat:

  # ---------------------------------------------------------- Tư bà bà
  - id: "tu_ba_ba"
    nhan_vat_goc: "tu_ba_ba"
    bien_the: "Hình dạng duy nhất — xuất hiện ở cả hai mốc thời gian của chương"
    ten: "Tư bà bà"
    ten_en: "Granny Si"
    vai_tro: "Người nhặt và nuôi Tần Mục, thợ may của thôn, cao thủ ẩn danh"
    vai_tro_en: "the village seamstress who found and raised Qin Mu, a hidden master"
    tuoi: 70
    gioi_tinh: "Nữ"
    dien_mao:
      khuon_mat: "Nhăn nheo, mắt sắc và tỉnh, cười lộ hàm răng thưa"
      toc: "Tóc bạc thưa búi thấp, quấn khăn vải sẫm"
      chieu_cao_the_trang: "Lưng gù rõ rệt, người thấp bé, bàn chân nhỏ"
    trang_phuc:
      chinh: "Áo vải chàm bạc màu tay rộng, ngoài khoác tạp dề thợ may xám"
    dau_an:
      dac_diem_rieng: "Lưng gù, hàm răng thưa, túi kim chỉ đeo bên hông"
    canonical_reference: "mvp0/refs/tu_ba_ba.png"
    canonical_reference_en:
      khuon_mat: "Deeply wrinkled old woman's face with a gap-toothed grin"
      mat: "Small dark eyes sunk under heavy lids, unusually alert"
      toc: "Thin white hair in a low bun under a faded dark headwrap"
      trang_phuc: "Faded indigo peasant tunic with wide sleeves over a grey seamstress apron"
      dac_diem_rieng: "Pronounced hunched back, gap-toothed smile, small needle-and-thread pouch at the hip"
    silhouette_cue_en:
      "pronounced hunched back, faded indigo tunic with wide sleeves,
       needle-and-thread pouch at the hip"
    body_type_relative_en:
      "very short and hunched, barely taller than Qin Mu at eleven, notably small feet"
    color_language_en: "faded indigo and dull grey, never any glow of her own"
    personality_en: "fierce, possessive, sharp-tongued, hides lethal skill behind an old seamstress"

  # ---------------------------------------------------------- Tần Mục (sơ sinh)
  - id: "tan_muc_so_sinh"
    nhan_vat_goc: "tan_muc"
    bien_the: "Sơ sinh — nửa đầu chương, mốc 11 năm trước"
    ten: "Tần Mục"
    ten_en: "Qin Mu"
    vai_tro: "Nhân vật chính (hình dạng sơ sinh)"
    vai_tro_en: "protagonist as a newborn, found in a basket at the river"
    tuoi: 0
    gioi_tinh: "Nam"
    dien_mao:
      khuon_mat: "Mặt trẻ sơ sinh tròn trịa, đang khóc rồi bật cười"
      toc: "Tóc tơ đen thưa"
      chieu_cao_the_trang: "Sơ sinh, nằm gọn trong một cái giỏ đan"
    trang_phuc:
      chinh: "Tã lót vải trắng thô"
    dau_an:
      dac_diem_rieng: "Ngọc bội khắc chữ Tần đặt cạnh tã, tỏa huỳnh quang xanh nhạt"
    canonical_reference: "mvp0/refs/tan_muc_so_sinh.png"
    canonical_reference_en:
      khuon_mat: "Round newborn face, cheeks flushed from crying, mouth open in a toothless laugh"
      mat: "Large dark newborn eyes still wet with tears"
      toc: "Sparse fine black baby hair"
      trang_phuc: "Coarse undyed white swaddling cloth, no other garment"
      dac_diem_rieng: "Pale jade pendant carved with a single character, giving off a faint green glow beside the swaddle"
    silhouette_cue_en:
      "newborn wrapped in coarse white swaddling inside a woven river basket,
       faintly glowing jade pendant lying beside him"
    body_type_relative_en:
      "newborn infant, small enough for Granny Si to carry in one basket"
    color_language_en: "pale jade-green pendant glow against undyed white cloth"
    personality_en: "unafraid, laughs instead of crying when held"

  # ---------------------------------------------------------- Tần Mục (11 tuổi)
  - id: "tan_muc_thieu_nien"
    nhan_vat_goc: "tan_muc"
    bien_the: "Thiếu niên 11 tuổi — nửa sau chương, mốc hiện tại"
    ten: "Tần Mục"
    ten_en: "Qin Mu"
    vai_tro: "Nhân vật chính (hình dạng thiếu niên), mục đồng của thôn"
    vai_tro_en: "protagonist at eleven, the village cowherd boy"
    tuoi: 11
    gioi_tinh: "Nam"
    dien_mao:
      khuon_mat: "Mi thanh mục tú, môi hồng răng trắng"
      toc: "Tóc đen buộc hờ sau gáy, mấy lọn rủ trước trán"
      chieu_cao_the_trang: "Thiếu niên gầy, cao ngang vai người lớn"
    trang_phuc:
      chinh: "Áo vải thô nâu nhạt mặc nửa mở, thắt lưng vải, chân đất"
    dau_an:
      dac_diem_rieng: "Ngọc bội chữ Tần đeo trước ngực trần, luôn nhìn thấy"
    canonical_reference: "mvp0/refs/tan_muc_thieu_nien.png"
    canonical_reference_en:
      khuon_mat: "Delicate handsome boyish face, clear brows, fair skin"
      mat: "Bright dark eyes with clean thin eyebrows"
      toc: "Black hair loosely tied at the nape, several strands falling over the forehead"
      trang_phuc: "Pale brown coarse hemp tunic worn half-open, cloth waist belt, bare feet"
      dac_diem_rieng: "Pale jade pendant on a cord, worn openly on the bare chest"
    silhouette_cue_en:
      "half-open pale brown hemp tunic over a bare chest, jade pendant on a cord,
       hair loosely tied at the nape"
    body_type_relative_en:
      "eleven-year-old boy, slim, the height reference every other character is measured against"
    color_language_en: "pale jade-green pendant glow over warm hemp brown"
    personality_en: "curious, gentle, easily shaken but quick to obey his elders"

  # ---------------------------------------------------------- Mã lão
  - id: "ma_lao"
    nhan_vat_goc: "ma_lao"
    bien_the: "Hình dạng duy nhất"
    ten: "Mã lão"
    ten_en: "Elder Ma"
    vai_tro: "Lão nhân trong thôn, cùng Tư bà bà vác tượng đá ra sông trong đêm"
    vai_tro_en: "village elder who carries the stone statue out to the river at night"
    tuoi: 65
    gioi_tinh: "Nam"
    dien_mao:
      khuon_mat: "Mặt vuông rám nắng, râu cằm bạc lởm chởm"
      toc: "Tóc bạc cắt ngắn, buộc khăn vải nâu"
      chieu_cao_the_trang: "Cao lớn vai rộng, chỉ còn cánh tay phải, bắp tay to khác thường"
    trang_phuc:
      chinh: "Áo vải nâu đất, ống tay áo trái buộc gọn ở vai vì rỗng"
    dau_an:
      dac_diem_rieng: "Cụt hẳn cánh tay trái từ vai; cánh tay phải có sức mạnh phi thường"
    canonical_reference: "mvp0/refs/ma_lao.png"
    canonical_reference_en:
      khuon_mat: "Square weathered old man's face with a patchy white stubble beard"
      mat: "Narrow dark eyes under heavy white brows"
      toc: "Short cropped white hair under a brown cloth headband"
      trang_phuc: "Earth-brown coarse work tunic, the empty left sleeve knotted up at the shoulder"
      # ⭐ Viết theo lối KHẲNG ĐỊNH — tả cái CÓ, không tả cái thiếu. Bản cũ dùng
      # "Left arm missing entirely" và model vẽ ra đủ hai tay kèm khúc xương rời.
      dac_diem_rieng: "A single right arm, unusually thick and heavily muscled; on his left side the tunic shoulder is a smooth rounded seam with the empty sleeve knotted shut flat against it"
    silhouette_cue_en:
      "empty left sleeve knotted at the shoulder, one thick right arm,
       earth-brown work tunic"
    body_type_relative_en:
      "tall and broad for an old man, a head and a half taller than Qin Mu at eleven"
    color_language_en: "earth brown and rust, warm dull tones"
    personality_en: "gruff, loyal, quick to bicker but first to volunteer"

  # ---------------------------------------------------------- Gia gia què
  - id: "gia_gia_que"
    nhan_vat_goc: "gia_gia_que"
    bien_the: "Hình dạng duy nhất"
    ten: "Gia gia què"
    ten_en: "Lame Grandpa"
    vai_tro: "Lão nhân trong thôn, thợ săn, dạy Tần Mục cước pháp"
    vai_tro_en: "village elder and hunter who teaches Qin Mu kicking techniques"
    tuoi: 68
    gioi_tinh: "Nam"
    dien_mao:
      khuon_mat: "Mặt hiền lành chất phác, hay cười, nhiều nếp nhăn quanh mắt"
      toc: "Tóc muối tiêu búi gọn thành búi nhỏ trên đỉnh đầu"
      chieu_cao_the_trang: "Gầy rắn, mất chân phải từ dưới đầu gối, chống gậy gỗ"
    trang_phuc:
      chinh: "Áo vải xanh rêu sẫm, quần ống rộng, ống quần phải buộc gọn dưới gối"
    dau_an:
      dac_diem_rieng: "Mất chân phải dưới đầu gối; gậy gỗ mộc; một thanh đao bản rộng đeo sau lưng"
    canonical_reference: "mvp0/refs/gia_gia_que.png"
    canonical_reference_en:
      khuon_mat: "Plain kindly old man's face with a broad easy smile and deep laugh lines"
      mat: "Warm crinkled eyes"
      toc: "Salt-and-pepper hair gathered into a small topknot"
      trang_phuc: "Dark moss-green cloth robe, wide trousers with the right leg tied off below the knee"
      dac_diem_rieng: "His right trouser leg is folded up at the knee and tied shut with cord, ending in a smooth rounded stump; he carries his weight on a plain wooden walking staff, a single broad saber slung across his back"
    silhouette_cue_en:
      "right trouser leg tied off below the knee, plain wooden staff,
       broad saber slung across the back"
    body_type_relative_en:
      "lean and wiry, roughly two heads taller than Qin Mu at eleven even while leaning on his staff"
    color_language_en: "dark moss green and worn leather brown"
    personality_en: "cheerful, unshakeable, kills without changing expression"

  # ---------------------------------------------------------- Trưởng thôn
  - id: "truong_thon"
    nhan_vat_goc: "truong_thon"
    bien_the: "Hình dạng duy nhất"
    ten: "Trưởng thôn"
    ten_en: "Village Chief"
    vai_tro: "Trưởng thôn Tàn Lão, người đặt tên Tần Mục, dạy Tần Mục thuật hít thở"
    vai_tro_en: "chief of Canlao Village, the one who named Qin Mu and taught him breathing"
    tuoi: 75
    gioi_tinh: "Nam"
    dien_mao:
      khuon_mat: "Mặt gầy trơ xương, thần thái trầm tĩnh"
      toc: "Tóc bạc dài xõa trên cáng"
      chieu_cao_the_trang: "Mất cả hai tay hai chân, thân người nằm trên cáng tre"
    trang_phuc:
      chinh: "Áo choàng vải trắng ngà rộng phủ kín thân"
    dau_an:
      dac_diem_rieng: "Không tay không chân; luôn nằm trên cáng tre do người khác khiêng"
    canonical_reference: "mvp0/refs/truong_thon.png"
    canonical_reference_en:
      khuon_mat: "Gaunt hollow-cheeked old face, calm and composed"
      mat: "Half-closed pale eyes with a steady gaze"
      toc: "Long loose white hair spread across the stretcher"
      trang_phuc: "Wide bone-white cloth robe draped over the whole torso"
      dac_diem_rieng: "A torso alone: both shoulders end in smooth rounded stumps and the body ends just below the hips, the empty sleeves and the robe hem folded flat and tucked beneath him as he lies full length on a carried bamboo stretcher"
    silhouette_cue_en:
      "limbless torso in a bone-white robe lying on a carried bamboo stretcher"
    body_type_relative_en:
      "limbless torso, always carried at the waist height of standing villagers, never upright"
    color_language_en: "bone white and pale bamboo, no saturated color"
    personality_en: "quiet, respected without effort, settles what no one else dares to"

  # ---------------------------------------------------------- Yêu phụ (dạng bò)
  - id: "yeu_phu_bo"
    nhan_vat_goc: "yeu_phu"
    bien_the: "Dạng bò cái — bị phong ấn 11 năm, làm nhũ mẫu của Tần Mục"
    ten: "Bò cái"
    ten_en: "The Cow"
    vai_tro: "Phu nhân Tương Long thành chủ bị Tư bà bà phong ấn thành bò, nhũ mẫu của Tần Mục"
    vai_tro_en: "a noblewoman sealed into the body of a cow, wet nurse to Qin Mu"
    tuoi: 11
    gioi_tinh: "Cái"
    dien_mao:
      khuon_mat: "Đầu bò cái mõm rộng, ánh mắt ướt như người biết khóc"
      toc: "Lông vàng nâu ngắn, túm lông thô dọc gáy"
      chieu_cao_the_trang: "Bò cái trưởng thành, lưng đủ rộng cho một thiếu niên ngồi"
    trang_phuc:
      chinh: "Không mặc gì — chỉ có dây thừng xỏ mũi bện bằng vải"
    dau_an:
      dac_diem_rieng: "Da bò rỗng bên trong, không máu thịt không khung xương; mắt bò rưng rưng như người"
    canonical_reference: "mvp0/refs/yeu_phu_bo.png"
    canonical_reference_en:
      khuon_mat: "Bovine head with a broad muzzle and an unnaturally human, tearful expression"
      mat: "Large wet dark cow eyes carrying visible human sorrow"
      toc: "Short hide in dull tan and dirty cream patches only, a coarse tuft running along the neck"
      trang_phuc: "Bare hide, wearing only a braided cloth nose rope through the muzzle"
      # ⭐ `character_sheet_prompt` chỉ đọc 5 khóa canonical_reference_en — nó KHÔNG
      # đọc `body_type_relative_en`, nên hình dạng bốn chân phải nằm ở ĐÂY, nếu
      # không model sẽ vẽ chân dung nửa người có vai áo.
      dac_diem_rieng: "A full-bodied four-legged cow standing on all fours in profile; short blunt horns; the hide hangs slightly loose over the frame, as if hollow underneath"
    silhouette_cue_en:
      "dull tan-and-cream cow with short blunt horns and a braided cloth nose rope,
       hide hanging slightly loose"
    body_type_relative_en:
      "adult cow, back tall enough for Qin Mu at eleven to sit on comfortably"
    color_language_en: "dull tan hide and dirty cream, no glow"
    personality_en: "pleading, manipulative, carrying eleven years of stored resentment"

  # ---------------------------------------------------------- Yêu phụ (dạng người)
  - id: "yeu_phu_nguoi"
    nhan_vat_goc: "yeu_phu"
    bien_the: "Dạng người — sau khi tấm da bò bị lột ra"
    ten: "Yêu phụ"
    ten_en: "The Freed Woman"
    vai_tro: "Phu nhân Tương Long thành chủ sau khi thoát khỏi phong ấn, phản diện dạng người"
    vai_tro_en: "the same noblewoman freed from the seal, antagonist in human form"
    tuoi: 28
    gioi_tinh: "Nữ"
    dien_mao:
      khuon_mat: "Mặt đàn bà hai, ba mươi tuổi, tái nhợt, méo đi vì hận"
      toc: "Tóc đen dài bù xù rối tung, che nửa mặt"
      chieu_cao_the_trang: "Người lớn gầy, da tái xanh vì mười một năm không thấy nắng"
    trang_phuc:
      chinh: "Áo lụa lót rách bạc màu, ẩm và bết vào người"
    dau_an:
      dac_diem_rieng: "Vệt liền da đỏ tấy quanh hai đùi, nơi thịt từng dính vào tấm da bò"
    canonical_reference: "mvp0/refs/yeu_phu_nguoi.png"
    canonical_reference_en:
      khuon_mat: "Pale gaunt woman's face in her late twenties, twisted with hatred"
      mat: "Bloodshot dark eyes, wide and unblinking"
      toc: "Long black hair in a wild matted tangle covering half the face"
      trang_phuc: "Ragged faded silk inner robe, damp and clinging"
      dac_diem_rieng: "Sickly pale skin from eleven years without sunlight; raw red seam-marks around both thighs where the hide was joined"
    silhouette_cue_en:
      "wild matted long black hair covering half the face, ragged damp silk robe,
       raw red seam-marks around both thighs"
    body_type_relative_en:
      "adult woman, roughly two heads taller than Qin Mu at eleven"
    color_language_en: "sickly grey-green skin with dried-blood red on the ragged silk"
    personality_en: "vengeful, theatrical, snaps from pleading to murderous without warning"

