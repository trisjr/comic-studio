# AI Coding
# story-bible.yaml
# Story Bible cho MVP0 — Danh sách nhân vật (nhan_vat) và bối cảnh (boi_canh) dùng
# chung cho toàn bộ chương truyện. Điền thông tin của chương mới vào đây trước khi
# chạy skill /mvp0-page-prompt để sinh page YAML theo mvp0/prompt-template.txt.
#
# RÀNG BUỘC KỸ THUẬT:
# - Cần tối đa 2-3 nhân vật chính xuất hiện lặp lại để đo Consistency (G1-a, G1-d).
# - Mỗi nhân vật bắt buộc có `id` viết liền không dấu (dùng làm tên file ref:
#   mvp0/refs/<id>.png, đúng bằng `canonical_reference`).
# - Các trường tiếng Anh (`silhouette_cue_en`, `body_type_relative_en`,
#   `color_language_en`, `personality_en`, và toàn bộ `canonical_reference_en.*`,
#   `setting_en`, `environment_en`, `lighting_default_en`, `props_en`) được skill
#   /mvp0-page-prompt CHIẾU 1:1 (projected 1:1) vào khối CHARACTERS và CONTINUITY
#   của mvp0/prompt-template.txt khi soạn page YAML — KHÔNG qua LLM enhance nào
#   trong script (D-34/SRS-FR-17); scripts/mvp0/compile_prompt.py chỉ serialize
#   page YAML đã soạn sẵn thành text prompt, không tự sinh câu chữ mới.
# - Theo D4: `ten`/`ten_en` được phép dùng trong các trường prose của page YAML
#   (continuity.spatial, composition, panel_purpose...); còn các trường STRUCTURED
#   (characters[].id, panels[].characters[].character_id, typeset.dialogue[].speaker)
#   BẮT BUỘC dùng `id` (character_id), không được dùng tên.

