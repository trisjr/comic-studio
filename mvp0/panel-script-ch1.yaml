        action: "Mặt đất nghĩa địa nứt ra thành từng đường dài"
        camera: { shot: "wide", angle: "high", subject: "mặt đất nứt" }
        visual_constraints: { palette: "nâu đất, đen", motion: "rung chuyển" }
        text_safe_zone: [{ x: 0.60, y: 0.05, w: 0.35, h: 0.30 }]
