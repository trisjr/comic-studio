        camera: { shot: "wide", angle: "eye", subject: "ba nhân vật" }
        visual_constraints:
          palette: "trắng, nâu sẫm, xanh nhạt"
          flashback_treatment: "viền khung mềm"
          state_ref: "flashback"
          attribute_binding: >
            ⭐⭐ PANEL QUAN TRONG NHAT cho G1-d truc 3 nhan vat.
            Ba bo trang phuc PHAI gan dung nguoi: TRANG = bach_y_nu (co kiem),
            NAU SAM = lam_phu (co nhan ngoc luc), XANH NHAT = lam_uyen (tay khong).
        text_safe_zone: [{ x: 0.05, y: 0.72, w: 0.90, h: 0.25 }]
        text_safe_zone_warning: false
        beat_type: "climax"
        emphasis: "normal"
        character_count: 3
        characters: ["bach_y_nu", "lam_phu", "lam_uyen"]

