        text_safe_zone: [{ x: 0.60, y: 0.05, w: 0.35, h: 0.22 }]
        text_safe_zone_warning: false
        beat_type: "transition"
        emphasis: "normal"
        character_count: 2
        characters: ["bach_y_nu", "lam_phu"]

      - panel_index: 16
