# AI Coding
# panel-script-ch1.yaml
# Panel script VIET TAY cho MVP0 — chuong comic #1, 22 panel / 6 trang.
# Rang buoc: Roadmap §2 deliverable pre-cycle — "~8-30 panel".
# Ten truong khop DUNG cot cua `comic.panel` (DB-Entity-Comic-IR.md) de panel
# script nay nap thang duoc vao schema MVP1 ma ⛔ khong phai dich lai.
# ⚠️ MVP0 ⛔ KHONG co database — day la file phang, dung theo MVP-Scope §3.1.
#
# Quy uoc bat buoc:
#   - Moi toa do la 0-1 (INV-5), ⛔ khong pixel.
#   - character_count <= 3 (INV-2).
#   - beat_type thuoc danh muc khoi tao: climax | reaction | transition | establishing.
#   - emphasis thuoc: normal | large | full_page.
#   - Emphasis quota ca chuong: 1 full_page + 2-3 large (ADR-012 D-23).

meta:
  chuong_comic: 1
  tong_panel: 22
  tong_trang: 6
  emphasis_da_dung:
    full_page: 1   # panel 11
    large: 3       # panel 6, 9, 18
  ngan_sach_uoc_tinh: "22 panel x N=3 = 66 anh x $0.134 ~= $8.84 (duoi tran ~$12)"

pages:

  # ---------- TRANG 1 — Mo dau: vung dat chet ----------
  - page_no: 1
    page_layout: { rows: [{ y: 0.00, h: 0.45, panels: [1] }, { y: 0.45, h: 0.30, panels: [2] }, { y: 0.75, h: 0.25, panels: [3] }] }
    panels:
      - panel_index: 1
        action: "Bầu trời đêm không trăng, mây đen dày đặc, một tia chớp màu đỏ xé ngang tầng mây"
        camera: { shot: "extreme_wide", angle: "low", subject: "bầu trời" }
        visual_constraints: { palette: "đen, đỏ máu", light_source: "chớp đỏ trên mây", mood: "áp bức" }
        text_safe_zone: [{ x: 0.05, y: 0.05, w: 0.40, h: 0.15 }]
        text_safe_zone_warning: false
        beat_type: "establishing"
        emphasis: "normal"
        character_count: 0
        characters: []

      - panel_index: 2
        action: "Những ngọn núi cháy rụi trải dài, xa xa là bóng thành trì Hắc Uyên"
        camera: { shot: "extreme_wide", angle: "eye", subject: "dãy núi và thành trì" }
        visual_constraints: { palette: "xám tro, đen", light_source: "chớp đỏ", mood: "hoang tàn" }
        text_safe_zone: [{ x: 0.55, y: 0.10, w: 0.40, h: 0.20 }]
        text_safe_zone_warning: false
        beat_type: "establishing"
        emphasis: "normal"
        character_count: 0
        characters: []

      - panel_index: 3
        action: "Chuông đồng cổ treo trên cổng thành, mặt chuông rỉ xanh, đang rung"
        camera: { shot: "medium", angle: "low", subject: "chuông đồng" }
        visual_constraints: { palette: "xanh rỉ, đen", motion: "rung, có vệt mờ" }
        text_safe_zone: [{ x: 0.05, y: 0.70, w: 0.30, h: 0.25 }]
        text_safe_zone_warning: false
        beat_type: "transition"
        emphasis: "normal"
        character_count: 0
        characters: []

  # ---------- TRANG 2 — Mat dat mo ra ----------
