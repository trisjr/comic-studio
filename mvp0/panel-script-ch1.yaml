# Panel script cho MVP0 — Chương comic #1 (Template).
# Điền kịch bản phân cảnh của chương truyện mới vào đây.
#
# RÀNG BUỘC KỸ THUẬT MVP0:
# - Tổng panel: khuyến nghị 15–25 panel (đủ đo Gate G1: consistency, multi-char, typeset).
# - Tối đa 3 nhân vật trong cùng 1 panel (`character_count` <= 3, trần INV-2).
# - Tọa độ `text_safe_zone` chuẩn hóa từ 0.0 đến 1.0 (x, y, w, h).
# - `panel_index` đánh số tăng dần liên tục từ 1.

meta:
  chuong_comic: 1
  tong_panel: 0
  tong_trang: 0

pages: []
