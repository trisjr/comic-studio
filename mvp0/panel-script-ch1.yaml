        text_safe_zone: [{ x: 0.65, y: 0.05, w: 0.30, h: 0.20 }]
        text_safe_zone_warning: false
        beat_type: "climax"
        emphasis: "normal"
        character_count: 0
        characters: []

      - panel_index: 9
