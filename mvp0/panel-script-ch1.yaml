        camera: { shot: "full_body", angle: "eye", subject: "lam_uyen" }
        visual_constraints: { palette: "đen, đỏ khô", state_ref: "truoc_panel_20", detail: "áo đen rách nát, tóc bết" }
        text_safe_zone: [{ x: 0.60, y: 0.08, w: 0.35, h: 0.22 }]
        text_safe_zone_warning: false
        beat_type: "climax"
        emphasis: "large"
        character_count: 1
        characters: ["lam_uyen"]

      - panel_index: 10
