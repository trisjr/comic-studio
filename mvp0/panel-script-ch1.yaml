      - panel_index: 14
        action: "FLASHBACK — Đại sảnh Lâm gia. Lâm phụ quỳ dưới đất, Lâm Uyên (quá khứ) đứng phía sau ông"
        camera: { shot: "medium_wide", angle: "eye", subject: "lam_phu và lam_uyen" }
        visual_constraints:
          palette: "xanh nhạt, nâu sẫm, vàng nến"
          flashback_treatment: "viền khung mềm, độ tương phản thấp hơn hiện tại"
          state_ref: "flashback"
          attribute_binding: "⭐ lam_uyen mặc áo LỤA XANH NHẠT; lam_phu mặc áo gấm NÂU SẪM có nhẫn ngọc lục"
        text_safe_zone: [{ x: 0.05, y: 0.05, w: 0.35, h: 0.20 }]
        text_safe_zone_warning: false
        beat_type: "establishing"
        emphasis: "normal"
        character_count: 2
        characters: ["lam_phu", "lam_uyen"]

