        visual_constraints: { palette: "trắng bệch, nâu đất", detail: "móng tay gãy, da nứt" }
        text_safe_zone: []
        text_safe_zone_warning: true
        beat_type: "climax"
        emphasis: "normal"
        character_count: 0
        characters: []

      - panel_index: 6
        action: "Toàn cảnh: hàng nghìn bàn tay trắng nhô lên khắp cánh đồng mộ"
        camera: { shot: "extreme_wide", angle: "high", subject: "cánh đồng bàn tay" }
        visual_constraints: { palette: "trắng, đen, đỏ", density: "dày đặc kín khung", mood: "kinh dị" }
        text_safe_zone: [{ x: 0.05, y: 0.05, w: 0.35, h: 0.15 }]
        text_safe_zone_warning: false
        beat_type: "climax"
        emphasis: "large"
        character_count: 0
        characters: []

      - panel_index: 7
